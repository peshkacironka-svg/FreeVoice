name: FreeVoice iOS Build

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Build FreeVoice for iOS Simulator
        run: |
          xcodebuild \
            -project FreeVoice.xcodeproj \
            -scheme FreeVoice \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload FreeVoice Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeVoice-iOS-Simulator
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/FreeVoice.app
          if-no-files-found: error
          retention-days: 7
