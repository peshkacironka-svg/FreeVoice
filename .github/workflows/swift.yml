name: FreeVoice iPhone Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -n 1)
          if [ -n "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          fi
          xcodebuild -version

      - name: Build FreeVoice for physical iPhone
        run: |
          xcodebuild \
            -project FreeVoice.xcodeproj \
            -scheme FreeVoice \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA for Sideloadly
        run: |
          mkdir -p build/IPA/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/FreeVoice.app build/IPA/Payload/
          cd build/IPA
          /usr/bin/zip -r ../FreeVoice-unsigned.ipa Payload

      - name: Upload FreeVoice iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: FreeVoice-iPhone-unsigned-IPA
          path: build/FreeVoice-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
